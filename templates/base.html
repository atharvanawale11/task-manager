<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Field Log{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
{% load static %}
</head>
<body>

<header class="ticker">
  <div class="ticker__brand">FIELD LOG</div>
  <div class="ticker__stats">
    <span><em id="stat-pending">0</em> Pending</span>
    <span><em id="stat-progress">0</em> In Progress</span>
    <span><em id="stat-done">0</em> Done</span>
  </div>
  <div class="ticker__user">
    {% if user.is_authenticated %}
      {{ user.username }} · <a href="{% url 'logout' %}">Log out</a>
    {% endif %}
  </div>
</header>

<main class="app-shell">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
